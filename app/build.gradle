apply plugin: 'com.android.application'

android {
    compileSdk 25
    buildToolsVersion "25.0.2"
    namespace 'projekt.interfacer'

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "projekt.interfacer"
        minSdk 25
        targetSdk 25
        versionCode 62
        versionName "sixty two"
    }

    compileOptions {
        incremental true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def projectDir = project.projectDir
            def buildTypeDir = variant.buildType.name
            output.outputFileName = "themeinterfacer.apk"
            def outputFileDir = new File("$projectDir/release_apk/$buildTypeDir")
            if (!outputFileDir.exists()) {
                outputFileDir.mkdirs()
            }
            output.outputFile = new File(outputFileDir, output.outputFileName)
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dependencies {
        testImplementation 'junit:junit:4.12'
        implementation 'androidx.core:core-ktx:1.10.1'
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'com.google.android.material:material:1.9.0'
        implementation 'de.robv.android.xposed:api:82'
        implementation 'de.robv.android.xposed:api:82:sources'
    }
}
